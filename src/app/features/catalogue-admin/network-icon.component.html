<!--
  One viewBox for all of them so they sit on the same baseline at the same
  weight. Strokes rather than filled glyphs: at 16px a filled mark turns into a
  blob, and a stroked one keeps its shape.
-->
<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
  @switch (network()) {
    @case ('instagram') {
      <rect x="3" y="3" width="18" height="18" rx="5" />
      <circle cx="12" cy="12" r="4.2" />
      <circle class="dot" cx="17.2" cy="6.8" r="1.1" />
    }
    @case ('instagram reel video') {
      <rect x="3" y="3" width="18" height="18" rx="5" />
      <!-- The frame, cut by the diagonal the reel mark is known by. -->
      <path d="M7.8 3.2 11 8.6M14 3.2l3.2 5.4M3.2 8.7h17.6" />
      <path class="solid" d="M10.4 11.6v4.8l4.2-2.4z" />
    }
    @case ('threads') {
      <!-- The loop of the a, open at the top right, with its tail. -->
      <path
        d="M16.6 11.4c-.3-3-2.1-4.5-4.6-4.5-2.9 0-4.7 2-4.7 5.1s1.8 5.1 4.6 5.1c2.1 0 3.4-.9 3.9-2.4"
      />
      <path d="M9.9 13.4c0-1.2 1-1.9 2.6-1.9 2.3 0 3.6 1 3.6 2.6 0 1.9-1.4 3-3.3 3" />
    }
    @case ('bluesky') {
      <!-- Two wings from one body: the butterfly, at the size it still reads. -->
      <path
        class="solid"
        d="M12 10.6C10.9 8.4 8.2 5.3 6.2 4.5 4 3.6 3 4.6 3 6.3c0 1.7 1 5.5 1.6 6.2.6.7 1.9 1 3.1.8-2.3.4-2.8 1.8-1.6 3.2 1.2 1.4 3.4 1.2 4.4-.6.5-.9.8-1.7.9-2.3.1.6.4 1.4.9 2.3 1 1.8 3.2 2 4.4.6 1.2-1.4.7-2.8-1.6-3.2 1.2.2 2.5-.1 3.1-.8.6-.7 1.6-4.5 1.6-6.2 0-1.7-1-2.7-3.2-1.8-2 .8-4.7 3.9-5.8 6.1z"
      />
    }
    @case ('facebook') {
      <!-- The f, which is the whole mark at this size. -->
      <path d="M14.8 7.4h2V4.3c-.4-.1-1.4-.2-2.4-.2-2.4 0-3.9 1.4-3.9 4v2.3H8v3.4h2.5v8.1h3.4v-8.1h2.6l.4-3.4h-3V8.4c0-.7.3-1 1-1z" class="solid" />
    }
  }
</svg>
