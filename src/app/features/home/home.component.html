<section class="home">
  <div class="home-intro">
    <h1 #heroTitle class="home-name">Juanma Moreno Sánchez</h1>
    <p class="home-tagline">{{ 'home.tagline' | translate }}</p>
  </div>

  @if (featured(); as nft) {
    <a
      class="home-featured"
      draggable="false"
      [routerLink]="['/artwork', nft.tokenId]"
      [attr.aria-label]="nft.name"
    >
      <span
        class="home-featured-frame"
        [style.aspect-ratio]="featuredAspect()"
        [style.width]="frameWidth()"
      >
        @if (featuredThumb(); as thumb) {
          <img
            class="home-featured-image home-featured-image--preview"
            [src]="thumb"
            alt=""
            decoding="async"
            draggable="false"
          />
        }
        @if (featuredFull(); as full) {
          <img
            class="home-featured-image home-featured-image--full"
            [class.loaded]="fullLoaded()"
            [src]="full"
            [alt]="nft.name"
            decoding="async"
            draggable="false"
            (load)="onFullLoad($event)"
          />
        }
      </span>
      <span class="home-featured-caption catalog-caption">{{ nft.name }}</span>
    </a>
  }
</section>

<!--
  Which pair of builds you are looking at. Small and last, because it is for
  the artist and anyone reporting a problem, not for a visitor reading about
  paintings. The api half stays blank when the backend cannot be reached.
-->
<p class="build-versions">
  v{{ appVersion }}@if (apiVersion()) {<span> · api v{{ apiVersion() }}</span>}
</p>
