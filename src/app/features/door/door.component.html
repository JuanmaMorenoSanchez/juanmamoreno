<div class="container margin-top door">
  <h1 class="catalog-heading">Door</h1>

  <p class="door-message">This door opens for one wallet.</p>

  <button type="button" class="door-wallet" [disabled]="signing()" (click)="withWallet()">
    {{ signing() ? 'Ask your wallet…' : 'Sign in with your wallet' }}
  </button>

  @if (problem()) {
    <p class="door-problem" role="alert">{{ problem() }}</p>
  }
</div>
