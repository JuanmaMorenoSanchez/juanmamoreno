<div class="canvas-frame">
  <!-- The palette. Built from what the engine said it can do, never from a list here. -->
  <aside class="palette">
    <h3>Nodes</h3>
    @for (type of catalogue(); track type.key) {
      <button type="button" class="palette-node" [title]="type.summary" (click)="add(type)">
        <span class="palette-label">{{ type.label }}</span>
        <span class="palette-kind">{{ type.category }}</span>
      </button>
    }
    @if (!catalogue().length) {
      <p class="palette-empty">The engine has not said what it can do.</p>
    }
  </aside>

  <svg
    class="canvas"
    (pointerdown)="startPan($event)"
    (pointermove)="move($event)"
    (pointerup)="release()"
    (pointerleave)="release()"
    (wheel)="wheel($event)"
  >
    <g [attr.transform]="'translate(' + panX() + ',' + panY() + ') scale(' + zoom() + ')'">
      <!-- Wires under the boxes, so a box is never hidden by one. -->
      @for (edge of edges(); track $index) {
        <path class="wire" [attr.d]="wire(edge)" (click)="cut(edge)">
          <title>Click to unplug</title>
        </path>
      }
      @if (pulling()) {
        <path class="wire wire-pulling" [attr.d]="pullingWire()" />
      }

      @for (node of nodes(); track node.id) {
        @if (typeOf(node); as type) {
          <g class="node">
            <rect
              class="node-body"
              [attr.x]="node.x"
              [attr.y]="node.y"
              [attr.width]="wide(node)"
              [attr.height]="height(node)"
              rx="6"
            />
            <rect
              class="node-header"
              [attr.x]="node.x"
              [attr.y]="node.y"
              [attr.width]="wide(node)"
              height="30"
              rx="6"
              (pointerdown)="grab($event, node)"
            />
            <!-- The corner to drag. Width only: a box is as tall as what is
                 in it, and a height held by hand would fight the content. -->
            <rect
              class="node-stretch"
              [attr.x]="node.x + wide(node) - 14"
              [attr.y]="node.y + height(node) - 14"
              width="14"
              height="14"
              (pointerdown)="stretch($event, node)"
              [attr.data-testid]="'stretch-' + node.id"
            />
            <text class="node-name" [attr.x]="node.x + 10" [attr.y]="node.y + 20">
              {{ type.label }}
            </text>
            <!-- The ? beside the name. Hover to read, press to pin it open. -->
            <circle
              class="help-dot"
              [attr.cx]="node.x + width - 34"
              [attr.cy]="node.y + 15"
              r="8"
              (pointerenter)="showHelp(node.id)"
              (pointerleave)="hideHelp()"
              (click)="pinHelp($event, node.id)"
              (pointerdown)="$event.stopPropagation()"
            />
            <text
              class="help-mark"
              [attr.x]="node.x + width - 34"
              [attr.y]="node.y + 19"
              (pointerenter)="showHelp(node.id)"
              (click)="pinHelp($event, node.id)"
              (pointerdown)="$event.stopPropagation()"
            >
              ?
            </text>
            <text
              class="node-close"
              [attr.x]="node.x + width - 14"
              [attr.y]="node.y + 20"
              (click)="remove(node.id)"
            >
              ×
            </text>

            <!-- Inputs down the left. -->
            @for (port of type.inputs; track port.name; let i = $index) {
              <circle
                class="port port-in"
                [class.port-optional]="port.optional"
                [class.port-joined]="joined(node, port.name)"
                [class.port-wanting]="wanting(node, port)"
                [attr.cx]="node.x"
                [attr.cy]="inY(node, i)"
                r="5"
                (pointerup)="finishWire($event, node, port.name, port.kind)"
              >
                <title>
                  {{ port.name }} ({{ port.kind }}{{ port.optional ? ', optional' : '' }})
                </title>
              </circle>
              <text
                class="port-name"
                [class.port-name-wanting]="wanting(node, port)"
                [attr.x]="node.x + 12"
                [attr.y]="inY(node, i) + 4"
              >
                {{ port.name }}
              </text>
            }

            <!-- Outputs down the right. -->
            @for (port of type.outputs; track port.name; let i = $index) {
              <circle
                class="port port-out"
                [attr.cx]="node.x + width"
                [attr.cy]="outY(node, i)"
                r="5"
                (pointerdown)="startWire($event, node, port.name, port.kind)"
              >
                <title>{{ port.name }} ({{ port.kind }})</title>
              </circle>
              <text
                class="port-name port-name-out"
                [attr.x]="node.x + width - 12"
                [attr.y]="outY(node, i) + 4"
              >
                {{ port.name }}
              </text>
            }

            <!-- Controls, one row each, below the ports. -->
            @for (param of type.params; track param.name; let p = $index) {
              <foreignObject
                [attr.x]="node.x + 8"
                [attr.y]="rowTop(node, type, p)"
                [attr.width]="wide(node) - 16"
                [attr.height]="rowHeight(node, param)"
              >
                <div class="param" [class.param-wide]="param.kind === 'text'">
                  <!--
                    A caption, not a <label>: it sits beside the control rather
                    than wrapping it, and the control is named by aria-label.

                    None at all for a sentence. A text box is the full width of
                    the node and the caption would take a third of it to say
                    what the placeholder and the ? already say.
                  -->
                  @if (param.kind !== 'text') {
                    <span [title]="param.label || param.name">{{ param.label || param.name }}</span>
                  }
                  @if (param.kind === 'points') {
                    <!-- Edited on the painting, not in a box this size. -->
                    <button
                      type="button"
                      class="param-draw"
                      (click)="drawing.emit(node)"
                      (pointerdown)="$event.stopPropagation()"
                      [attr.data-testid]="'draw-' + node.id"
                    >
                      {{ markCount(node) ? markCount(node) + ' marks — edit' : 'Draw…' }}
                    </button>
                  } @else if (param.kind === 'number') {
                    <input
                      type="number"
                      [attr.aria-label]="param.label || param.name"
                      [value]="node.params[param.name]"
                      [attr.min]="param.minimum"
                      [attr.max]="param.maximum"
                      [attr.step]="param.step"
                      (change)="setParam(node, param, $any($event.target).value)"
                      (pointerdown)="$event.stopPropagation()"
                    />
                  } @else if (param.kind === 'choice') {
                    <!-- The engine says what the values are, so a style added
                         there is an option here with nothing released. -->
                    <select
                      [attr.aria-label]="param.label || param.name"
                      (change)="setParam(node, param, $any($event.target).value)"
                      (pointerdown)="$event.stopPropagation()"
                    >
                      @for (choice of param.choices; track choice) {
                        <option [value]="choice" [selected]="node.params[param.name] === choice">
                          {{ choice }}
                        </option>
                      }
                    </select>
                  } @else if (param.kind === 'toggle') {
                    <input
                      type="checkbox"
                      [attr.aria-label]="param.label || param.name"
                      [checked]="!!node.params[param.name]"
                      (change)="setParam(node, param, $any($event.target).checked)"
                      (pointerdown)="$event.stopPropagation()"
                    />
                  } @else {
                    <!--
                      A box rather than a line. What goes in these is an
                      instruction or a sentence about motion, and both run past
                      the width of a node: typing one in a single line meant
                      writing the end of it blind.
                    -->
                    <textarea
                      rows="5"
                      [attr.aria-label]="param.label || param.name"
                      [attr.placeholder]="param.label || param.name"
                      [value]="node.params[param.name]"
                      (change)="setParam(node, param, $any($event.target).value)"
                      (pointerdown)="$event.stopPropagation()"
                    ></textarea>
                  }
                </div>

                <!--
                  What the engine says is unwise about the number, in its own
                  words. Not a refusal: the value is accepted and run, because
                  the limits it would break are the ones already on the field.
                -->
                @if (caution(node, param); as why) {
                  <p
                    class="param-caution"
                    [attr.data-testid]="'caution-' + node.id + '-' + param.name"
                  >
                    {{ why }}
                  </p>
                }
              </foreignObject>
            }

            <!-- The painting itself, chosen inside the box that is for it.
                 It was a strip above the canvas, which is the diagram saying
                 "the painting goes here" while the painting went somewhere
                 else — and the thumbnail and its name sat up there too,
                 nowhere near the box they describe. -->
            @if (node.type === 'painting') {
              <foreignObject
                [attr.x]="node.x + 8"
                [attr.y]="chooserTop(node, type)"
                [attr.width]="wide(node) - 16"
                [attr.height]="chooserHeight(node)"
              >
                <div class="painting-in" (pointerdown)="$event.stopPropagation()">
                  <input
                    type="file"
                    accept="image/*"
                    (change)="choseFile.emit($event)"
                    aria-label="The painting"
                    data-testid="painting"
                  />
                  <span class="painting-or">
                    <input
                      type="text"
                      inputmode="numeric"
                      placeholder="…or a token id"
                      [value]="tokenId()"
                      (input)="typedToken.emit($any($event.target).value)"
                      (keydown.enter)="enteredToken.emit()"
                      aria-label="…or a token id"
                      data-testid="token-id"
                    />
                    @if (fetching()) {
                      <span class="painting-fetching" data-testid="fetching">Fetching…</span>
                    }
                  </span>

                  @if (painting(); as url) {
                    <span class="painting-chosen">
                      <img [src]="url" alt="The painting about to be worked on" />
                      @if (paintingName(); as called) {
                        <span data-testid="chosen">{{ called }}</span>
                      }
                    </span>
                  }
                </div>
              </foreignObject>
            }
          </g>
        }
      }

      <!-- Drawn after every box, and nothing is drawn after it.
           SVG has no z-index: what comes last is on top. Inside the
           loop this sat under any node that happened to be drawn
           later, which is most of them. -->
      @if (helpingNode(); as node) {
        @if (typeOf(node); as type) {
          <foreignObject
            [attr.x]="helpAt(node).x"
            [attr.y]="helpAt(node).y"
            width="310"
            height="430"
            class="help-layer"
          >
            <div class="help-panel">
              <h4>
                {{ type.label }}
                @if (pinned() === node.id) {
                  <button type="button" class="help-close" (click)="pinHelp($event, node.id)">
                    close
                  </button>
                }
              </h4>
              @for (para of helpParagraphs(type); track $index) {
                <p>{{ para }}</p>
              }

              @if (!helpParagraphs(type).length) {
                <p>This engine did not send an explanation for this box.</p>
              }

              @if (type.params.length) {
                <h5>What you can adjust</h5>
                @for (param of type.params; track param.name) {
                  <p class="help-param">
                    <strong>{{ param.label || param.name }}.</strong>
                    {{ param.help || 'No note for this one yet.' }}
                  </p>
                }
              }

              @if (type.inputs.length || type.outputs.length) {
                <h5>What it joins to</h5>
                <p class="help-ports">
                  @if (type.inputs.length) {
                    <span> in: {{ inputNames(type) }} </span>
                  }
                  @if (type.outputs.length) {
                    <span> out: {{ outputNames(type) }} </span>
                  }
                </p>
              }
            </div>
          </foreignObject>
        }
      }
    </g>
  </svg>
</div>
