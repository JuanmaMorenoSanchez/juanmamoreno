<!-- The engine's own list. This page knows none of these by name, which is why
     a flow added to flows.py appears here with nothing released. -->
<section class="flow-row" data-testid="flows">
  <h2 class="flow-head">Start from something</h2>

  <ul class="flow-list">
    @for (flow of flows(); track flow.key) {
      <li>
        <button
          type="button"
          class="flow-pick"
          (click)="start(flow)"
          [attr.data-testid]="'flow-' + flow.key"
        >
          <strong>{{ flow.label }}</strong>
          <span>{{ flow.blurb }}</span>
        </button>
        <button
          type="button"
          class="flow-why"
          [attr.aria-label]="'What ' + flow.label + ' does'"
          (click)="toggle(flow)"
          [attr.data-testid]="'why-' + flow.key"
        >
          ?
        </button>
      </li>
    }
  </ul>

  <p class="flow-note">Replaces what is on the canvas.</p>

  @if (explaining(); as flow) {
    <article class="flow-about" data-testid="flow-about">
      <h3>{{ flow.label }}</h3>
      @for (paragraph of paragraphs(flow); track $index) {
        <p>{{ paragraph }}</p>
      }
      <button
        type="button"
        class="flow-close"
        (click)="explaining.set(null)"
        data-testid="close-about"
      >
        Close
      </button>
    </article>
  }
</section>
