<mat-drawer-container>
  <mat-drawer #drawer mode="over" position="end" class="drawer">
    <div class="drawer-content">
      <ng-container *ngTemplateOutlet="menuButtons"></ng-container>
    </div>
  </mat-drawer>

  <mat-drawer-content>
    <mat-toolbar color="primary">
      <mat-toolbar-row>
        @if (!heroTitleVisible()) {
          <button aria-label="Juanma Moreno Sánchez" mat-button [routerLink]="lang.link()">
            <p class="catalog-heading brand">Juanma Moreno Sánchez</p>
          </button>
        }
        <span class="spacer"></span>

        @if (!mobileMenu()) {
          <button
            aria-expanded="false"
            aria-controls="menu"
            mat-icon-button
            (click)="drawer.toggle()"
            aria-label="Toggle menu"
          >
            <mat-icon>menu</mat-icon>
          </button>
        } @else {
          <ng-container *ngTemplateOutlet="menuButtons"></ng-container>
        }
      </mat-toolbar-row>
    </mat-toolbar>
  </mat-drawer-content>
</mat-drawer-container>

<ng-template #menuButtons>
  <button x mat-button [matMenuTriggerFor]="paintingMenu">
    {{ 'paintings' | translate }}
  </button>
  @if (generativePieces.length) {
    <button
      [attr.aria-label]="'menu.generative' | translate"
      mat-button
      [matMenuTriggerFor]="generativeMenu"
    >
      {{ 'menu.generative' | translate }}
    </button>
  }
  <button [attr.aria-label]="'menu.about' | translate" mat-button [routerLink]="lang.link('about')">
    {{ 'menu.about' | translate }}
  </button>
  <button aria-label="CV" mat-button [routerLink]="lang.link('cv')">CV</button>
  <button [attr.aria-label]="'menu.texts' | translate" mat-button [routerLink]="lang.link('texts')">
    {{ 'menu.texts' | translate }}
  </button>
  <button [attr.aria-label]="'menu.contact' | translate" mat-button [routerLink]="lang.link('contact')">
    {{ 'menu.contact' | translate }}
  </button>
  <button
    aria-label="Language switcher"
    mat-button
    [matMenuTriggerFor]="languageMenu"
    [attr.aria-expanded]="languageTrigger.menuOpen"
    #languageTrigger="matMenuTrigger"
  >
    {{ currentLangLabel }}
    <mat-icon>arrow_drop_down</mat-icon>
  </button>
</ng-template>

<mat-menu #paintingMenu="matMenu">
  <button [attr.aria-label]="'menu.allPaintings' | translate" mat-menu-item [routerLink]="lang.link('artworks')">
    {{ 'menu.allPaintings' | translate }}
  </button>
  <button
    [attr.aria-label]="'menu.byYear' | translate"
    mat-menu-item
    [matMenuTriggerFor]="yearsMenu"
  >
    {{ 'menu.byYear' | translate }}
  </button>
</mat-menu>

<mat-menu #yearsMenu="matMenu">
  @for (year of years; track year) {
    <button
      [attr.aria-label]="year"
      mat-menu-item
      [routerLink]="lang.link('artworks')"
      [queryParams]="{ years: year }"
    >
      {{ year }}
    </button>
  }
</mat-menu>

<mat-menu #generativeMenu="matMenu">
  @for (piece of generativePieces; track piece.id) {
    <button [attr.aria-label]="piece.label" mat-menu-item [routerLink]="lang.link('generative/' + piece.id)">
      {{ piece.label }}
    </button>
  }
</mat-menu>

<!-- Collapsed to the current language until it is opened, so the bar keeps
     showing one code rather than every language on offer. -->
<mat-menu #languageMenu="matMenu">
  @for (language of languages; track language.code) {
    <button
      mat-menu-item
      [disabled]="language.code === activeLanguage"
      [attr.aria-current]="language.code === activeLanguage ? 'true' : null"
      (click)="selectLanguage(language.code)"
    >
      {{ language.label }}
    </button>
  }
</mat-menu>
