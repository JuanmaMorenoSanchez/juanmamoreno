<button
  mat-icon-button
  (click)="createPDF()"
  [disabled]="isCreating()"
  [matTooltip]="getTooltip()"
  [attr.aria-label]="getTooltip()"
  matTooltipPosition="below"
>
  @if (!isCreating()) {
    <mat-icon>assignment</mat-icon>
  } @else if (progress() > 0) {
    <mat-progress-spinner diameter="24" mode="determinate" [value]="progressPercent()"></mat-progress-spinner>
  } @else {
    <mat-progress-spinner diameter="24" mode="indeterminate"></mat-progress-spinner>
  }
</button>
@if (isCreating() && progress() > 0) {
  <span class="pdf-progress-label">{{ progressPercent() }}%</span>
}
