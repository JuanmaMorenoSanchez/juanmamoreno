<div class="container center">
  <h2 class="catalog-heading">{{ 'notFound.title' | translate }}</h2>
  <p>{{ 'notFound.message' | translate }}</p>
  <!--
    Real links, built for the language the reader is in. As buttons calling
    router.navigate('/artworks') these were the site's own way of dropping a
    Spanish reader into English — and they were reached, by definition, by
    someone who had already gone wrong once. Anchors also restore
    middle-click, open-in-new-tab and the keyboard.
  -->
  <mat-list role="list">
    <mat-list-item>
      <a mat-button color="primary" [routerLink]="lang.link('artworks')">
        {{ 'paintings' | translate }}
      </a>
    </mat-list-item>
    <mat-list-item>
      <a mat-button color="primary" [routerLink]="lang.link('about')">
        {{ 'statement.title' | translate }}
      </a>
    </mat-list-item>
    <mat-list-item>
      <a mat-button color="primary" [routerLink]="lang.link('cv')">CV</a>
    </mat-list-item>
    <mat-list-item>
      <a mat-button color="primary" [routerLink]="lang.link('contact')">
        {{ 'menu.contact' | translate }}
      </a>
    </mat-list-item>
  </mat-list>
</div>
