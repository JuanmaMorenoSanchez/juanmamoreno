<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script>
      window.global = window;
      /*
        Says that scripts run here, before the first pixel is painted.

        The top bar holds both menus and css picks one. Only one of those picks
        needs a script to be any use: a hamburger that cannot be opened is worse
        than no control at all, so without this class a reader gets the row of
        links at every width — which is what every prerendered page showed for
        the site's whole life. Set here rather than in a `<noscript>` block,
        because the prerenderer escapes a `<style>` inside one into plain text
        and the rule never arrives: measured, on a phone with scripting off,
        as a page with no way out of it.
      */
      document.documentElement.classList.add('js');
    </script>
    <!--
      The reader's theme, applied before the first pixel is painted. Inline and
      blocking on purpose: anything asynchronous means the page paints on one
      ground and then swaps to the other, which is the thing a stored
      preference exists to avoid. Only an explicit choice is stamped — with
      none, the stylesheet's prefers-color-scheme rules decide, which is also
      what happens with javascript switched off entirely.
    -->
    <script>
      (function () {
        try {
          var chosen = localStorage.getItem('juanmamoreno.theme');
          if (chosen === 'dark' || chosen === 'light') {
            document.documentElement.dataset.theme = chosen;
          }
        } catch (e) {
          /* private browsing: the system preference decides */
        }
      })();
    </script>
    <title>Juanma Moreno Sánchez, artist.</title>
    <meta
      name="description"
      content="Contemporary painting, generative art, software and information about the artist."
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1f1f1f" />
    <base href="/" />

    <link rel="canonical" href="https://juanmamoreno.com/" />

    <link rel="icon" type="image/x-icon" href="favicon.ico" />

    <!--
      The typeface, fetched as early as the parser can be told about it.

      Without this it is discovered only when the stylesheet is parsed, which
      on a page with javascript is after the first paint — so the toolbar was
      drawn in Arial, Archivo arrived, every word in it changed width, the row
      wrapped differently and the whole page jumped 36 pixels. Measured at
      0.35 of layout shift against a ceiling of 0.1, which fails the build.

      `crossorigin` is required even though the file is our own: a font is
      always fetched in CORS mode, and a preload without it fetches the file a
      second time rather than matching the one the stylesheet asks for.
    -->
    <link
      rel="preload"
      href="assets/fonts/archivo-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Juanma Moreno Sánchez" />
    <meta property="og:title" content="Juanma Moreno Sánchez, artist." />
    <meta
      property="og:description"
      content="Contemporary painting, generative art, software and information about the artist."
    />
    <meta property="og:url" content="https://juanmamoreno.com/" />
    <meta
      property="og:image"
      content="https://juanmamoreno.com/assets/images/abstract_landscape.jpg"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Juanma Moreno Sánchez, artist." />
    <meta
      name="twitter:description"
      content="Contemporary painting, generative art, software and information about the artist."
    />
    <meta
      name="twitter:image"
      content="https://juanmamoreno.com/assets/images/abstract_landscape.jpg"
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Juanma Moreno Sánchez",
        "url": "https://juanmamoreno.com",
        "jobTitle": "Artist",
        "image": "https://juanmamoreno.com/assets/images/juanma_estudio.jpg",
        "sameAs": ["https://www.instagram.com/juanmamorenosanchez/", "https://galeriazunino.com/"]
      }
    </script>
  </head>
  <body class="mat-typography">
    <app-root></app-root>
  </body>
</html>
