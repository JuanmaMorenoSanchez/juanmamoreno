    <meta name="description" content="Rosa, como una flor marchita, pero con la energía de la juventud.  Un gesto de confusión, quizás una mueca ante el sol, o el peso de la identidad tatuada.  El cuerpo, un lienzo improvisado donde la piel lleva la huella de un nombre.  Un cinturón dorado, un intento de ancla en un mundo en movimiento.  La botella, un elixir rojo, metáfora de la sed y el deseo.  Una escena suspendida, un instante capturado entre risas y dudas.  Un personaje que es todos y nadie.">

<div class="cdk-live-announcer-element cdk-visually-hidden" aria-atomic="true" aria-live="polite" id="cdk-live-announcer-2"></div><script id="ng-state" type="application/json">{"61084f335f98a9ec0680e81453239ebd2eda9deb66e074b3efa00e71193654e7":{"b":{"success":true,"message":null,"data":{"tokenId":"12","urls":["https:\u002F\u002Fwww.facebook.com\u002Fjuanmamorenoart\u002F"]}},"h":{},"s":200,"st":"OK","u":"https:\u002F\u002Fbackend.juanmamoreno.com\u002Fvision\u002Fsearch\u002F12","rt":"json"},"7b3721c26cffa233ba38dfcc34613d2b0da104ee9f18ec3a71d06ce6b21ebfc7":{"b":{"success":true,"message":null,"data":{"tokenId":"12","translated":[{"lang":"en","shortDesc":"Beneath a sky of uncertain hue, a flash of pink against the green. The gaze is direct, a mirror to a heart caught between exhilaration and the sharp sting of self-doubt. The name etched on skin, a grounding anchor in this whirl of candy-colored hair and fleeting moments. Held in the hand, a dark elixir - a question mark perhaps, or a fleeting comfort to the rising tide of uncertainty? This is a dance on the edge, where joy and apprehension meet, and everything seems a little too real."},{"lang":"es","shortDesc":"Rosa, como una flor marchita, pero con la energía de la juventud.  Un gesto de confusión, quizás una mueca ante el sol, o el peso de la identidad tatuada.  El cuerpo, un lienzo improvisado donde la piel lleva la huella de un nombre.  Un cinturón dorado, un intento de ancla en un mundo en movimiento.  La botella, un elixir rojo, metáfora de la sed y el deseo.  Una escena suspendida, un instante capturado entre risas y dudas.  Un personaje que es todos y nadie."}],"createdAt":{"_seconds":1757854749,"_nanoseconds":849000000},"updatedAt":{"_seconds":1757854749,"_nanoseconds":849000000}}},"h":{},"s":200,"st":"OK","u":"https:\u002F\u002Fbackend.juanmamoreno.com\u002Fdescriptions\u002F12","rt":"json"},"__nghData__":[{"t":{"0":"t0"},"c":{"0":[]}},{"t":{"0":"t1","3":"t2"},"c":{"0":[{"i":"t1","r":1}],"3":[]},"n":{"3":
