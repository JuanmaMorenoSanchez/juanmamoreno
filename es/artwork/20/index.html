<div class="cdk-live-announcer-element cdk-visually-hidden" aria-atomic="true" aria-live="polite" id="cdk-live-announcer-2"></div><script id="ng-state" type="application/json">{"c14f2698ed948e4e28fb80b3c2dfbbc78d8cba286fd01b9675ec3fbeda419e49":{"b":{"success":true,"message":null,"data":{"sold":["23","24","25","26","30","34","37","58","59","61","64","66","70","71","72","74","75","77","94","97","112","114","115","117","118","126","136","159","161","163","165"]}},"h":{},"s":200,"st":"OK","u":"https:\u002F\u002Fbackend.juanmamoreno.com\u002Favailability","rt":"json"},"9a445183e5bd098c10d03dfd6df1ef93523e62bb948f071f6fae27f1e8abf557":{"b":{"success":true,"message":null,"data":{"tokenId":"20","translated":[{"lang":"en","shortDesc":"The moment hovers between a celebration and a quiet, internal reckoning. Beneath the electric flare of a sparkler, the subject’s expression remains unreadable, caught in the stillness of a wish that feels heavy with the weight of thirty-three years. In the twilight air, time seems to stutter—the joy of the ritual is offset by a ghostly, isolated atmosphere, turning a simple birthday into a suspended meditation on what it means to be seen in the dark."},{"lang":"es","shortDesc":"El peso de los años se sostiene con las manos extendidas, ofreciendo una celebración que parece suceder en un vacío suspendido. En el rostro de quien recibe la luz de la bengala hay una seriedad que desarma: no es la alegría eufórica de un aniversario, sino la pausa consciente de quien observa el tiempo pasar. La chispa, violenta y efímera contra el cielo eléctrico y crepuscular, ilumina una cifra que marca una transición, un recordatorio de que crecer es, a menudo, un acto de resistencia silenciosa ante la inmensidad que nos rodea. Es un instante donde la festividad se vuelve introspección, dejando el resto del mundo, oscuro y lejano, como un eco irrelevante."}],"createdAt":{"_seconds":1789632320,"_nanoseconds":505000000},"updatedAt":{"_seconds":1789632320,"_nanoseconds
