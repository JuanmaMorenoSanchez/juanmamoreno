<div class="cdk-live-announcer-element cdk-visually-hidden" aria-atomic="true" aria-live="polite" id="cdk-live-announcer-103"></div><script id="ng-state" type="application/json">{"7333876faa6f16c1630ac08626202449714e2f0e869130e1d411810d1e424491":{"b":{"success":true,"message":null,"data":{"tokenId":"199","translated":[{"lang":"en","shortDesc":"A heavy, dark-bodied machine rests in the afternoon heat, a silent monument of steel caught in a state of idle suspension. Behind it, the trees erupt in an impossible, neon-flushed bloom, turning the mundane edge of a parking lot into a landscape of flickering memory. It is a quiet study of contrasts—the grounded weight of industry against the ethereal, dream-like bleed of nature, capturing that fleeting, slightly uncanny stillness found in the middle of a long, sun-drenched day."},{"lang":"es","shortDesc":"Un silencio pesado de tarde veraniega flota sobre el asfalto. La camioneta, una mole de metal oscuro, se planta firme bajo una arboleda que ha decidido encenderse en tonos eléctricos, casi artificiales. Es la colisión entre la utilidad mecánica y la excentricidad de la naturaleza; un momento suspendido donde el progreso humano parece apenas un intruso, extrañamente estático, ante un paisaje que reclama su derecho a vibrar fuera de toda lógica."}],"createdAt":{"_seconds":1789632887,"_nanoseconds":576000000},"updatedAt":{"_seconds":1789632887,"_nanoseconds":576000000}}},"h":{},"s":200,"st":"OK","u":"https:\u002F\u002Fbackend.juanmamoreno.com\u002Fdescriptions\u002F199","rt":"json"},"__nghData__":[{"t":{"0":"t0","3":"t1"},"c":{"0":[{"i":"t0","r":1}],"3":[]},"n":{"3":"hfn4"}},{},{"n":{"2":"hfn","5":"hfn2"},"t":{"5":"t4"},"c":{"5":[]}},{"n":{"2":"hfn2"},"t":{"2":"t6"},"c":{"2":[]}},{"t":{"0":"t13"},"c":{"0":[]}},{"n":{"1":"0fn2","3":"1f2","5":"0fn3","6":"5f","7":"6f"},"t":{"4":"t2","8":"t9","10":"t10","11":"t11","12":"t3","39":"t14","43":"t15","47":"t16"},"c":{"4":[{"i":"t3","r":17,"n":{"1":"0fnf","6":"4fnf","9":"8fnf","12":"10f
