<div class="cdk-live-announcer-element cdk-visually-hidden" aria-atomic="true" aria-live="polite" id="cdk-live-announcer-51"></div><script id="ng-state" type="application/json">{"253b3004c2e8c2ae68ce2225e18b51109ceb5ce53eaf23537f4f744ee3eeeae8":{"b":{"success":true,"message":null,"data":{"tokenId":"34","translated":[{"lang":"en","shortDesc":"Behind sunglasses the sun and the shadows are both reflected,  a tiny double exposure. A child,  protected and imprisoned, or maybe already the master of his own game. He looks back at us, not without a trace of defiance. Is he lost in the world or is the world lost in him? A world where zebras wear sweaters and a dog becomes a toy, a memory, or an illusion in the hands of some blurry, invisible giant.  Green and blue, the child's colours, that's what we are left to.  He might be any of us.  He might be all of us."},{"lang":"es","shortDesc":"En la quietud de una mirada, el mundo se deforma y se refleja. Un niño, blindado tras gafas oscuras, es a la vez espectador y reflejo. En su sudadera, cebras, emblemas de la libertad que aún no conoce, corretean sobre un azul profundo. Su pose, un desafío. A su lado, un perro suspendido, como una pregunta a punto de ser formulada. Un escenario que sugiere una infancia en constante equilibrio, entre el juego y la certeza de la observación. La espera. La melancolía del sol poniente, que colorea el cielo."}],"createdAt":{"_seconds":1769970521,"_nanoseconds":972000000},"updatedAt":{"_seconds":1769970521,"_nanoseconds":972000000}}},"h":{},"s":200,"st":"OK","u":"https:\u002F\u002Fjuanmamoreno-backend-164035848667.europe-southwest1.run.app\u002Fdescriptions\u002F34","rt":"json"},"b54a8fd12e87f466da753b448f877fb52b73b7227009a513522dbf64676be30e":{"b":{"success":true,"message":null,"data":{"tokenId":"34","urls":["https:\u002F\u002Fachtungmag.com\u002Fde-lo-mistico-y-lo-absurdo-exposicion-virtual-de-juan-manuel-moreno-sanchez-en-galeria-zunino\u002F"]}},"h":{},"s":200,"st":"OK","u":"https:\u002F\u002F
