<div class="cdk-live-announcer-element cdk-visually-hidden" aria-atomic="true" aria-live="polite" id="cdk-live-announcer-79"></div><script id="ng-state" type="application/json">{"affbfdbbd5bf0ae51de0780ac1d0d91d8d0218de8426df70ecdd23f047f566ce":{"b":{"success":true,"message":null,"data":{"tokenId":"201","translated":[{"lang":"en","shortDesc":"A sudden gust of amber light caught in the tangled mess of human presence. It captures the frantic, weightless energy of a moment suspended, where the edges of self dissolve into an atmosphere of bruised purples and mossy greens. What remains is not a portrait, but the impression of a thought taking flight—a chaotic, sun-drenched turbulence that feels both intimate and impossibly wild."},{"lang":"es","shortDesc":"Una llamarada de hebras doradas que desafía la gravedad, suspendida en un instante de liberación absoluta. El cabello se expande como una galaxia de rizos indomables, trazando una coreografía caótica contra un cielo que se deshace en verdes profundos y púrpuras inciertos. No hay peso, solo la energía eléctrica de un movimiento detenido en el aire, el reflejo de un pensamiento que estalla hacia afuera, dejando atrás cualquier atisbo de control para habitar, finalmente, su propia intensidad."}],"createdAt":{"_seconds":1789632896,"_nanoseconds":102000000},"updatedAt":{"_seconds":1789632896,"_nanoseconds":102000000}}},"h":{},"s":200,"st":"OK","u":"https:\u002F\u002Fbackend.juanmamoreno.com\u002Fdescriptions\u002F201","rt":"json"},"__nghData__":[{"t":{"0":"t0","3":"t1"},"c":{"0":[{"i":"t0","r":1}],"3":[]},"n":{"3":"hfn4"}},{},{"n":{"2":"hfn","5":"hfn2"},"t":{"5":"t4"},"c":{"5":[]}},{"n":{"2":"hfn2"},"t":{"2":"t6"},"c":{"2":[]}},{"t":{"0":"t13"},"c":{"0":[]}},{"n":{"1":"0fn2","3":"1f2","5":"0fn3","6":"5f","7":"6f"},"t":{"4":"t2","8":"t9","10":"t10","11":"t11","12":"t3","39":"t14","43":"t15","47":"t16"},"c":{"4":[{"i":"t3","r":17,"n":{"1":"0fnf","6":"4fnf","9":"8fnf","12":"10fnf","16":"14fnf","21":"18fn","22":"21f","26":"23fn
