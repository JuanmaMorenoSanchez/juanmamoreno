    <title>Entierro al atardecer · Juanma Moreno Sánchez</title>
    <meta name="description" content="La luz, un espejo en la mano, atrapa la mirada.  Allá arriba, un gesto señala, ¿la jaula de la razón, acaso?  O es la promesa de algo más, un sueño flotando en el cielo oscuro.  La hierba verde y el sol poniente acarician, mientras la sombra de la duda se cierne.  Un cigarrillo, una decisión.  Una pausa en la pradera.  ¿Hacia dónde nos dirigimos? El teléfono, la conexión, o la desconexión.  Un instante de silencio.">
