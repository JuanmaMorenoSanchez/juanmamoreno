ant rose. Against an unrelenting, clear-sky blue, the subject sits in a state of suspended metamorphosis—part lush vegetation, part heavy, liquid drapery. It captures the quiet tension between growth and decay, suggesting a nature that is simultaneously blooming and unraveling, heavy with the weight of its own vivid presence."><!----><!----><!----><!----><!----></div></div><p _ngcontent-ng-c2683350453 id="viewer-hints" class="viewer-hints"><!----><span _ngcontent-ng-c2683350453>Double-click for fullscreen, Esc to leave</span></p></div></app-image-viewer><div _ngcontent-ng-c309511126 class="art-piece-labels"><h1 _ngcontent-ng-c309511126><i _ngcontent-ng-c309511126>Madonna (I). <small _ngcontent-ng-c309511126><!--ngetn--></small></i></h1><p _ngcontent-ng-c309511126 class="catalog-caption artwork-facts"><small _ngcontent-ng-c309511126><a _ngcontent-ng-c309511126 href="/artworks?years=2020" jsaction="click:;">2020</a>, Oil on canvas, 120 x 100 cm. <!----><app-sold-toggle _ngcontent-ng-c309511126 _nghost-ng-c262876866 ngh="14"><!----></app-sold-toggle></small></p><!----></div><app-artwork-record _ngcontent-ng-c309511126 _nghost-ng-c1805418733 style="width: min(100%, calc(100vh * 0.8421052631578947));" ngh="15"><!----></app-artwork-record><app-artwork-critic _ngcontent-ng-c309511126 _nghost-ng-c2940150192 style="width: min(100%, calc(100vh * 0.8421052631578947));" ngh="16"><!----></app-artwork-critic><!----><mat-divider _ngcontent-ng-c309511126 role="separator" class="mat-divider separator mat-divider-horizontal" aria-orientation="horizontal" ngh="1"></mat-divider><p _ngcontent-ng-c309511126 class="more-on">More on 2019–2020</p><app-art-pieces-list _ngcontent-ng-c309511126 _nghost-ng-c3014786059 ngh="17"><div _ngcontent-ng-c3014786059 class><!----><mat-grid-list _ngcontent-ng-c3014786059 appparallaxtilt guttersize="10" rowheight="1:1" role="list" aria-label="Art Pieces" class="mat-grid-list" style="padding-bottom: calc(2 * ((16.666666666666668% - (10px * 0.833333333333333 <div class="cdk-live-announcer-element cdk-visually-hidden" aria-atomic="true" aria-live="polite" id="cdk-live-announcer-43"></div><script id="ng-state" type="application/json">{"c14f2698ed948e4e28fb80b3c2dfbbc78d8cba286fd01b9675ec3fbeda419e49":{"b":{"success":true,"message":null,"data":{"sold":["23","24","25","26","30","34","37","58","59","61","64","66","70","71","72","74","75","77","94","97","112","114","115","117","118","126","136","159","161","163","165"]}},"h":{},"s":200,"st":"OK","u":"https:\u002F\u002Fbackend.juanmamoreno.com\u002Favailability","rt":"json"},"00fba70ed51e535b1ccbdf82a794d4f1ee8d5e8a24a61a1c74b34f85c6045eba":{"b":{"success":true,"message":null,"data":{"tokenId":"82","translated":[{"lang":"en","shortDesc":"A saturated, sun-drenched collision of the organic and the artificial. The composition feels like a waking dream where the boundaries of familiar forms dissolve into molten shapes of ochre and vibrant rose. Against an unrelenting, clear-sky blue, the subject sits in a state of suspended metamorphosis—part lush vegetation, part heavy, liquid drapery. It captures the quiet tension between growth and decay, suggesting a nature that is simultaneously blooming and unraveling, heavy with the weight of its own vivid presence."},{"lang":"es","shortDesc":"Una forma orgánica, entre la carne y la fruta, ocupa el centro como un vestigio de algo que alguna vez tuvo nombre. Es una arquitectura blanda, envuelta en velos rosados que sugieren tanto una protección como un despojo. Al fondo, un cielo despejado e impasible observa el despliegue de estas texturas ámbar y rojizas, ajeno a la mutación que ocurre en primer plano. Es el retrato de la materia en su estado más vulnerable: un cuerpo que se deshace, se expande y se reconfigura, recordándonos que la belleza también reside en la extrañeza de lo que no termina de definirse."}],"createdAt":{"_seconds":1789632490,"_nanoseconds":918000000},"updatedAt":{"_seconds":1789632490,"_nanoseconds":918000000}}},"h":{},"s
