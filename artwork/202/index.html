<div class="cdk-live-announcer-element cdk-visually-hidden" aria-atomic="true" aria-live="polite" id="cdk-live-announcer-58"></div><script id="ng-state" type="application/json">{"979e71fc3487685d751c48f830032635e4e1c5f719e1627503c6a7f0a1440748":{"b":{"success":true,"message":null,"data":{"tokenId":"202","translated":[{"lang":"en","shortDesc":"A sudden rush of light catches the hair in a corona of gold, framing a face lost in the quiet intensity of play. The neon rhythm of a chevron-striped dress anchors the figure against a hazy, atmospheric expanse of bruised violet and mossy earth. Here, the boundary between the child and her environment dissolves into a blurred, sun-drenched restlessness—a suspended moment where time feels both fleeting and held fast."},{"lang":"es","shortDesc":"Un instante capturado en el umbral de la tarde, donde la luz parece derretirse sobre la piel. La figura habita un espacio fluido, suspendida entre el entusiasmo del movimiento y una quietud introspectiva. El cabello, una corona de chispas despeinadas, irradia la energía eléctrica de quien ignora el paso del tiempo, mientras el patrón rítmico del vestido se deshace en los bordes, recordándonos que la infancia no es un estado fijo, sino una vibración constante que se desvanece al intentar retenerla. Es la memoria de un verano que, aunque lejano, sigue ardiendo con la intensidad de un presente ininterrumpido."}],"createdAt":{"_seconds":1789633059,"_nanoseconds":797000000},"updatedAt":{"_seconds":1789633059,"_nanoseconds":797000000}}},"h":{},"s":200,"st":"OK","u":"https:\u002F\u002Fbackend.juanmamoreno.com\u002Fdescriptions\u002F202","rt":"json"},"__nghData__":[{"t":{"0":"t0","3":"t1"},"c":{"0":[{"i":"t0","r":1}],"3":[]},"n":{"3":"hfn4"}},{},{"n":{"2":"hfn","5":"hfn2"},"t":{"5":"t4"},"c":{"5":[]}},{"n":{"2":"hfn2"},"t":{"2":"t6"},"c":{"2":[]}},{"t":{"0":"t13"},"c":{"0":[]}},{"n":{"1":"0fn2","3":"1f2","5":"0fn3","6":"5f","7":"6f"},"t":{"4":"t2","8":"t9","10":"t10","11":"t11","12":"t3","39":"t1
