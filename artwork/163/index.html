    <meta charset="utf-8">
    <script>
      window.global = window;
      /*
        Says that scripts run here, before the first pixel is painted.

        The top bar holds both menus and css picks one. Only one of those picks
        needs a script to be any use: a hamburger that cannot be opened is worse
        than no control at all, so without this class a reader gets the row of
        links at every width — which is what every prerendered page showed for
        the site's whole life. Set here rather than in a `<noscript>` block,
        because the prerenderer escapes a `<style>` inside one into plain text
        and the rule never arrives: measured, on a phone with scripting off,
        as a page with no way out of it.
      */
      document.documentElement.classList.add('js');
    </script>
    <!--
      The reader's theme, applied before the first pixel is painted. Inline and
      blocking on purpose: anything asynchronous means the page paints on one
      ground and then swaps to the other, which is the thing a stored
      preference exists to avoid. Only an explicit choice is stamped — with
      none, the stylesheet's prefers-color-scheme rules decide, which is also
      what happens with javascript switched off entirely.
    -->
    <script>
      (function () {
        try {
          var chosen = localStorage.getItem('juanmamoreno.theme');
          if (chosen === 'dark' || chosen === 'light') {
            document.documentElement.dataset.theme = chosen;
          }
        } catch (e) {
          /* private browsing: the system preference decides */
        }
      })();
    </script>

<div class="cdk-live-announcer-element cdk-visually-hidden" aria-atomic="true" aria-live="polite" id="cdk-live-announcer-60"></div><script id="ng-state" type="application/json">{"hideBreadcrumb":true,"c14f2698ed948e4e28fb80b3c2dfbbc78d8cba286fd01b9675ec3fbeda419e49":{"b":{"success":true,"message":null,"data":{"sold":["23","24","25","26","30","34","37","58","59","61","64","66","70","71","72","74","75","77","94","97","112","114","115","117","118","126","136","159","161","163","165"]}},"h":{},"s":200,"st":"OK","u":"https:\u002F\u002Fbackend.juanmamoreno.com\u002Favailability","rt":"json"},"d67c74e7fa6798a943a603cc809ade82dfff7c7aee101ff7e4e99d687ce87345":{"b":{"success":true,"message":null,"data":{"tokenId":"163","translated":[{"lang":"en","shortDesc":"A quiet encounter between the observer and the observed, where the lush, immersive green of the woods softens the edges of a singular, intentional moment. The subject in red stands as a vibrant anchor against the fluid, shifting canopy, caught in the act of framing a piece of the world to keep it. It is a study in stillness—an invitation to pause and acknowledge the fragile tension between disappearing into nature and the desire to hold onto it, forever, through the lens."},{"lang":"es","shortDesc":"Un instante de quietud se despliega bajo el peso de un follaje denso y absoluto. La figura, vestida de un rojo que busca su lugar entre la inmensidad vegetal, se convierte en un filtro: el mundo se detiene frente a su lente, atrapado en el acto de observar. Es el silencio de quien intenta apresar la naturaleza, un encuentro donde la mirada del observador y la inmovilidad del bosque se reconocen, suspendidas en la espera de aquello que, una vez capturado, deja de pertenecer al tiempo para volverse memoria."}],"createdAt":{"_seconds":1789632818,"_nanoseconds":702000000},"updatedAt":{"_seconds":1789632818,"_nanoseconds":702000000}}},"h":{},"s":200,"st":"OK","u":"https:\u002F\u002Fbackend.juanmamoreno.com\u002Fdescriptions\u002F1
