<!DOCTYPE html><html lang="en" data-beasties-container><head>
    <meta charset="utf-8">
    <script>
      window.global = window;
      /*
        Says that scripts run here, before the first pixel is painted.

        The top bar holds both menus and css picks one. Only one of those picks
        needs a script to be any use: a hamburger that cannot be opened is worse
        than no control at all, so without this class a reader gets the row of
        links at every width — which is what every prerendered page showed for
        the site's whole life. Set here rather than in a `<noscript>` block,
        because the prerenderer escapes a `<style>` inside one into plain text
        and the rule never arrives: measured, on a phone with scripting off,
        as a page with no way out of it.
      */
      document.documentElement.classList.add('js');
    </script>
    <!--
      The reader's theme, applied before the first pixel is painted. Inline and
      blocking on purpose: anything asynchronous means the page paints on one
      ground and then swaps to the other, which is the thing a stored
      preference exists to avoid. Only an explicit choice is stamped — with
      none, the stylesheet's prefers-color-scheme rules decide, which is also
      what happens with javascript switched off entirely.
    -->
    <script>
      (function () {
        try {
          var chosen = localStorage.getItem('juanmamoreno.theme');
          if (chosen === 'dark' || chosen === 'light') {
            document.documentElement.dataset.theme = chosen;
          }
        } catch (e) {
          /* private browsing: the system preference decides */
        }
      })();
    </script>

er visible" src="https://arweave.net/tPf6J7fDy8UMEWGj2wyFmbI-izbF_1DEGAvnsZtZYBE" alt="A jarring collision of the sacred and the profane, where the heavy, formal silence of a sanctuary is interrupted by the raw, untethered reality of the flesh. In the foreground, a figure lies exposed on a sea of crimson, tethered to a dark, abstract shadow that seems to pull away from the body itself. Beyond this intimate ache, the ritual continues, indifferent and locked in its own emerald-hued serenity. It is a portrait of two worlds occupying the same breath: one defined by the weight of skin and human isolation, the other by the distant, structured light of tradition."><!----><!----><!----><!----><!----></div></div><p _ngcontent-ng-c2683350453 id="viewer-hints" class="viewer-hints"><!----><span _ngcontent-ng-c2683350453>Double-click for fullscreen, Esc to leave</span></p></div></app-image-viewer><div _ngcontent-ng-c1785486560 class="art-piece-labels"><h1 _ngcontent-ng-c1785486560><i _ngcontent-ng-c1785486560>El templo. <small _ngcontent-ng-c1785486560><!--ngetn--></small></i></h1><p _ngcontent-ng-c1785486560 class="catalog-caption artwork-facts"><small _ngcontent-ng-c1785486560><a _ngcontent-ng-c1785486560 href="/artworks?years=2010" jsaction="click:;">2010</a>, Watercolor on paper, 23 x 31 cm. <!----><app-sold-toggle _ngcontent-ng-c1785486560 _nghost-ng-c262876866 ngh="14"><!----></app-sold-toggle></small></p><!----></div><app-artwork-record _ngcontent-ng-c1785486560 _nghost-ng-c3777594558 style="width: min(100%, calc(100vh * 1.3493975903614457));" ngh="15"><!----></app-artwork-record><app-artwork-critic _ngcontent-ng-c1785486560 _nghost-ng-c2940150192 style="width: min(100%, calc(100vh * 1.3493975903614457));" ngh="16"><!----></app-artwork-critic><!----><mat-divider _ngcontent-ng-c1785486560 role="separator" class="mat-divider separator mat-divider-horizontal" aria-orientation="horizontal" ngh="1"></mat-divider><p _ngcontent-ng-c1785486560 class="more-on"><button _ngcontent-n
