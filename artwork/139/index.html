    <meta name="description" content="A sea of skin, sun-kissed and yielding to the weight of rest. The red bleeds into shadows, a forgotten embrace of dawn's first light. The back, a landscape of whispers, curves into a pillow, a silent plea for solace. Below, the stripes of the shorts, a flash of color, a forgotten joy. There's a yielding here, a surrender to the body's simple language of need. A moment of pause, a breath held before the day begins, a solitary haven of peace.">
