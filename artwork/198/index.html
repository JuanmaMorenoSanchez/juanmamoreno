<div class="cdk-live-announcer-element cdk-visually-hidden" aria-atomic="true" aria-live="polite" id="cdk-live-announcer-67"></div><script id="ng-state" type="application/json">{"e86266ced92e7633512ce033595515e4a14f2dffdea7076b115a9233b5e8b1ed":{"b":{"success":true,"message":null,"data":{"tokenId":"198","translated":[{"lang":"en","shortDesc":"A solitary figure drifts through an endless, rhythmic indigo tide, her identity swallowed by the horizon line that rests heavy against her brow. She exists in the quiet tension between presence and erasure, a warm pulse of amber light caught in a cool, murmuring deep. There is a gentle surrender in her posture, a moment of being entirely contained by the vastness, where the self is not lost, but merely waiting to be rediscovered within the blue."},{"lang":"es","shortDesc":"Una sombra densa, un bloque de medianoche, decide dónde termina la identidad y comienza el misterio. La figura emerge de un abismo de trazos azules, suspendida en una quietud que parece ahogada. La mirada desaparece, borrada por la franja oscura que corta el rostro, dejando apenas una boca entreabierta, en vilo, como una palabra que nunca termina de pronunciarse. Es la extraña ligereza de estar presente y, al mismo tiempo, de ser un eco que se desvanece en el fondo del agua."}],"createdAt":{"_seconds":1789632881,"_nanoseconds":503000000},"updatedAt":{"_seconds":1789632881,"_nanoseconds":503000000}}},"h":{},"s":200,"st":"OK","u":"https:\u002F\u002Fbackend.juanmamoreno.com\u002Fdescriptions\u002F198","rt":"json"},"__nghData__":[{"t":{"0":"t0","3":"t1"},"c":{"0":[{"i":"t0","r":1}],"3":[]},"n":{"3":"hfn4"}},{},{"n":{"2":"hfn","5":"hfn2"},"t":{"5":"t4"},"c":{"5":[]}},{"n":{"2":"hfn2"},"t":{"2":"t6"},"c":{"2":[]}},{"t":{"0":"t13"},"c":{"0":[]}},{"n":{"1":"0fn2","3":"1f2","5":"0fn3","6":"5f","7":"6f"},"t":{"4":"t2","8":"t9","10":"t10","11":"t11","12":"t3","39":"t14","43":"t15","47":"t16"},"c":{"4":[{"i":"t3","r":17,"n":{"1":"0fnf","6":"4fnf","9":"8fnf","12":"10fnf",
