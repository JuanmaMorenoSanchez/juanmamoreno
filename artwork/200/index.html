<div class="cdk-live-announcer-element cdk-visually-hidden" aria-atomic="true" aria-live="polite" id="cdk-live-announcer-65"></div><script id="ng-state" type="application/json">{"8713fc23669f9c133af3907986560226002b9d862ee7a020e76dcf5a73b3461f":{"b":{"success":true,"message":null,"data":{"tokenId":"200","translated":[{"lang":"en","shortDesc":"Sunlight filters through the canopy in a restless, electric tremor, turning leaves into shards of saturated neon. Beneath this vibrating light, the stillness of parked cars anchors the scene, caught in a quiet, mundane transition between arrivals and departures. The boundary between the organic reach of the branches and the clinical lines of the asphalt blurs, suggesting a place where the wild world and human transit briefly hold their breath in a humid, suspended afternoon."},{"lang":"es","shortDesc":"El sol atraviesa el follaje con una intensidad eléctrica, convirtiendo el verde en una vibración casi líquida que se filtra sobre el pavimento. Es un mediodía suspendido donde el cielo azul profundo parece presionar contra la copa de los árboles, mientras los vehículos, aparcados en una quietud absoluta, aguardan como sombras metálicas. Aquí, la luz no solo ilumina, sino que disuelve los contornos de lo cotidiano, revelando un espacio donde la naturaleza y el asfalto se confunden en un mismo latido de color incesante."}],"createdAt":{"_seconds":1789632892,"_nanoseconds":24000000},"updatedAt":{"_seconds":1789632892,"_nanoseconds":24000000}}},"h":{},"s":200,"st":"OK","u":"https:\u002F\u002Fbackend.juanmamoreno.com\u002Fdescriptions\u002F200","rt":"json"},"__nghData__":[{"t":{"0":"t0","3":"t1"},"c":{"0":[{"i":"t0","r":1}],"3":[]},"n":{"3":"hfn4"}},{},{"n":{"2":"hfn","5":"hfn2"},"t":{"5":"t4"},"c":{"5":[]}},{"n":{"2":"hfn2","5":"hfn3"},"t":{"5":"t4"},"c":{"5":[]}},{"t":{"0":"t10"},"c":{"0":[]}},{"n":{"1":"0fn2","3":"1f2","5":"0fn3","6":"5f","7":"6f"},"t":{"4":"t2","8":"t6","10":"t7","11":"t8","12":"t3","28":"t11","29":"t12","55":"t13
